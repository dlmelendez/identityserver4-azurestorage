
trigger:
- master

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: PowerShell@2
  displayName: 'Update appsettings.json storage connection (master branch builds only)'
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
  inputs:
    targetType: 'inline'
    script: '(Get-Content .\tests\Elcamino.IdentityServer.AzureStorage.Tests\appsettings.json) | Foreach-Object { $_ -replace ''UseDevelopmentStorage=true;'', ''$(STORAGECONNECTION)'' } | Set-Content .\tests\Elcamino.IdentityServer.AzureStorage.Tests\appsettings.json'

- bash: |
    set -e
    npm install -g azurite
    azurite --version
    mkdir -p $(Agent.TempDirectory)/azurite
    nohup azurite --loose --skipApiVersionCheck --location $(Agent.TempDirectory)/azurite > $(Agent.TempDirectory)/azurite.log 2>&1 < /dev/null &
    echo "Waiting for Azurite to start..."
    for i in {1..30}; do
      if (echo > /dev/tcp/127.0.0.1/10000) >/dev/null 2>&1 \
         && (echo > /dev/tcp/127.0.0.1/10001) >/dev/null 2>&1 \
         && (echo > /dev/tcp/127.0.0.1/10002) >/dev/null 2>&1; then
        echo "Azurite is ready"
        exit 0
      fi
      sleep 1
    done
    echo "Azurite did not start within 30 seconds"
    cat $(Agent.TempDirectory)/azurite.log
    exit 1
  displayName: 'Install and start Azurite storage emulator (latest) - CI builds only'
  condition: and(succeeded(), ne(variables['Build.SourceBranch'], 'refs/heads/master'))

- task: UseDotNet@2
  displayName: 'Use .Net Core sdk 8.x'
  inputs:
    version: 8.x

- task: UseDotNet@2
  displayName: 'Use .Net Core sdk 9.x'
  inputs:
    version: 9.x

- task: UseDotNet@2
  displayName: 'Use .Net Core sdk 10.x'
  inputs:
    version: 10.x

- task: DotNetCoreCLI@2
  displayName: 'dotnet build'
  inputs:
    projects: '**/ElCamino.IdentityServer.AzureStorage.sln'
    arguments: '-c $(BuildConfiguration) '

- task: DotNetCoreCLI@2
  inputs:
    command: 'test'
    publishTestResults: true
    projects: '**/ElCamino.IdentityServer.AzureStorage.Tests.csproj'
    arguments: '--no-build --collect:"XPlat Code Coverage" -c $(BuildConfiguration) -v d'

- task: PublishCodeCoverageResults@2
  displayName: 'Publish Code Coverage'
  inputs:
    summaryFileLocation: '$(Agent.TempDirectory)/**/coverage.cobertura.xml'

- task: CopyFiles@1
  displayName: 'Copy Files to: $(Build.ArtifactStagingDirectory)'
  inputs:
    Contents: |
     **/*.dll
     **/*.nupkg
     **/*.snupkg
     **/*.zip
     **/publish/**
    TargetFolder: '$(Build.ArtifactStagingDirectory)'
- task: PublishBuildArtifacts@1
  displayName: 'Publish Artifact: drop'